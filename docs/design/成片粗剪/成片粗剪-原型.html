<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>成片粗剪原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --border: 240 5.9% 90%;
        --ok: 5 150 105;
        --bad: 220 38 38;
        --warn: 180 83 9;
        --info: 2 132 199;
        --violet: 124 58 237;
        /* 原型里的产品色：和成片页截图一致的琥珀黄 */
        --brand: 222 160 30;
        --app-bg: 0 0% 98%;
        --app-panel: 0 0% 100%;
        --app-raised: 240 5% 94%;
        --app-track: 240 5% 90%;
        --app-line: 240 6% 86%;
        color-scheme: light;
      }
      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --muted-foreground: 240 5% 64.9%;
        --border: 240 3.7% 17%;
        --ok: 52 211 153;
        --bad: 248 113 113;
        --warn: 251 191 36;
        --info: 56 189 248;
        --violet: 167 139 250;
        --brand: 242 182 48;
        --app-bg: 0 0% 4%;
        --app-panel: 0 0% 8.5%;
        --app-raised: 0 0% 13%;
        --app-track: 0 0% 15%;
        --app-line: 0 0% 18%;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Geist, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: hsl(var(--app-bg));
        color: hsl(var(--foreground));
        -webkit-font-smoothing: antialiased;
        line-height: 1.55;
        overflow: auto;
      }
      .mono { font-family: "Geist Mono", "SF Mono", Consolas, monospace; }
      [data-lucide] { width: 1em; height: 1em; flex: none; }
      h2, h4, h5, p { margin: 0; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
      button:disabled { cursor: not-allowed; }
      .muted { color: hsl(var(--muted-foreground)); }
      .spacer { margin-left: auto; }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
      .t-ok { background: rgb(var(--ok) / 0.12); color: rgb(var(--ok)); }

      .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 80; pointer-events: none; }
      .toast > div { display: flex; align-items: center; gap: 8px; border: 1px solid hsl(var(--app-line)); background: hsl(var(--app-panel)); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.18); }

      /* ---------- 外框 ---------- */
      .app { min-width: 1120px; height: 100vh; min-height: 680px; display: flex; flex-direction: column; background: hsl(var(--app-bg)); position: relative; user-select: none; font-size: 13px; }
      .app-top { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid hsl(var(--app-line)); flex: none; }
      .app-top .title { font-weight: 600; font-size: 14px; }
      .pillbar { display: flex; gap: 2px; padding: 3px; border: 1px solid hsl(var(--app-line)); border-radius: 999px; background: hsl(var(--app-panel) / 0.6); margin: 0 auto; }
      .pillbar span { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; color: hsl(var(--muted-foreground)); }
      .pillbar span.on { background: hsl(var(--app-raised)); color: hsl(var(--foreground)); font-weight: 600; }
      .dotm { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--brand)); margin-left: 5px; vertical-align: 2px; }
      .dotg { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--ok)); margin-right: 8px; vertical-align: 1px; }
      .app-body { flex: 1; min-height: 0; display: flex; }
      .rail { width: 76px; border-right: 1px solid hsl(var(--app-line)); display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 14px; flex: none; overflow: hidden; }
      .rail-h { font-size: 11.5px; color: hsl(var(--muted-foreground)); margin-bottom: 6px; }
      .rail-i { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: hsl(var(--muted-foreground)); padding: 7px 0; }
      .rail-i [data-lucide] { width: 18px; height: 18px; color: hsl(var(--foreground) / 0.8); }
      .rail-sep { width: 44px; height: 1px; background: hsl(var(--app-line)); margin: 6px 0 10px; }
      .rail-eps { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-bottom: 12px; }
      .rail .ep { width: 58px; height: 58px; border-radius: 12px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: "Geist Mono", monospace; font-weight: 600; font-size: 16px; color: hsl(var(--muted-foreground)); }
      .rail .ep.on { background: hsl(var(--app-raised)); color: hsl(var(--foreground)); }
      .rail .ep .lk { position: absolute; top: 8px; right: 8px; width: 11px; height: 11px; }
      .rail .ep .bars { display: flex; gap: 3px; }
      .rail .ep .bars i { width: 7px; height: 3px; border-radius: 2px; background: hsl(var(--muted-foreground) / 0.35); }
      .rail .ep .bars i.on { background: rgb(var(--ok)); }
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

      /* ---------- 顶栏 ---------- */
      .bar { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 10px 24px; flex: none; }
      .bar h2 { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
      .errlink { color: rgb(var(--bad)); font-size: 12px; }
      .errlink:hover { text-decoration: underline; }
      .abtn { height: 32px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; border: 1px solid hsl(var(--app-line)); background: hsl(var(--app-panel) / 0.7); white-space: nowrap; }
      .abtn:hover:not(:disabled) { background: hsl(var(--app-raised)); }
      .abtn:disabled { opacity: 0.45; }
      .abtn.primary { min-width: 96px; justify-content: center; background: hsl(var(--foreground)); color: hsl(var(--background)); border-color: transparent; font-weight: 600; }
      .abtn.primary:hover:not(:disabled) { background: hsl(var(--foreground) / 0.88); }
      .abtn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
      .abtn [data-lucide] { width: 14px; height: 14px; }
      .p-info { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: rgb(var(--info) / 0.14); color: rgb(var(--info)); }
      .p-info:hover { background: rgb(var(--info) / 0.22); }
      .p-info [data-lucide] { width: 12px; height: 12px; }
      .syncwrap { position: relative; }
      .syncpop { position: absolute; top: 34px; left: 0; z-index: 45; width: 320px; padding: 8px; border-radius: 16px; background: hsl(var(--app-panel)); border: 1px solid hsl(var(--app-line)); box-shadow: 0 16px 40px rgb(0 0 0 / 0.35); font-size: 12.5px; }
      .sp-h { font-size: 11.5px; color: hsl(var(--muted-foreground)); padding: 4px 6px 6px; }
      .sp-i { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 6px; border-radius: 8px; }
      .sp-i:hover:not(:disabled) { background: hsl(var(--app-raised)); }
      .sp-i:disabled { cursor: default; color: hsl(var(--muted-foreground)); }
      .sp-i .d { width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--info)); flex: none; }
      .sp-i:disabled .d { background: hsl(var(--muted-foreground)); }
      .sp-i span:nth-child(2) { flex: 1; }
      .sp-i [data-lucide] { width: 13px; height: 13px; color: hsl(var(--muted-foreground)); }
      .sp-f { display: flex; align-items: center; gap: 6px; border-top: 1px solid hsl(var(--app-line)); margin-top: 6px; padding-top: 8px; }

      /* ---------- 剪辑台分栏 ---------- */
      .work { flex: 1; min-height: 0; display: flex; padding: 0 16px 14px; }
      .work.land { flex-direction: column; }
      .toprow { flex: 1; min-height: 0; display: flex; }
      .leftcol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .rz { flex: none; position: relative; }
      .rz-v { width: 10px; cursor: col-resize; }
      .rz-h { height: 10px; cursor: row-resize; }
      .rz::after { content: ""; position: absolute; border-radius: 2px; transition: background 0.15s; }
      .rz-v::after { top: 42%; bottom: 42%; left: 4px; width: 2px; }
      .rz-h::after { left: 46%; right: 46%; top: 4px; height: 2px; }
      .rz:hover::after, .rz.on::after { background: hsl(var(--muted-foreground) / 0.7); }
      .box { border-radius: 16px; background: hsl(var(--app-panel)); border: 1px solid hsl(var(--app-line)); }

      /* ---------- 素材 / 属性面板 ---------- */
      .panel { flex: none; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
      .leftcol .panel { flex: 1; min-height: 140px; }
      .pmode { display: flex; align-items: center; padding: 10px 12px 0; }
      .seg2 { display: inline-flex; padding: 2px; border-radius: 999px; background: hsl(var(--app-raised)); }
      .seg2 button { padding: 3px 12px; border-radius: 999px; font-size: 12px; color: hsl(var(--muted-foreground)); }
      .seg2 button.on { background: hsl(var(--app-panel)); color: hsl(var(--foreground)); font-weight: 600; }
      .seg-tabs { display: flex; gap: 4px; padding: 8px 10px 6px; }
      .seg-tabs button { padding: 5px 11px; border-radius: 999px; font-size: 12.5px; color: hsl(var(--muted-foreground)); }
      .seg-tabs button.on { background: hsl(var(--app-raised)); color: hsl(var(--foreground)); font-weight: 600; }
      .filters { display: flex; align-items: center; gap: 12px; padding: 2px 14px 8px; font-size: 12.5px; }
      .filters button { color: hsl(var(--muted-foreground)); padding-bottom: 3px; border-bottom: 2px solid transparent; }
      .filters button.on { color: hsl(var(--foreground)); border-color: hsl(var(--foreground)); }
      .plist { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
      .sgroup { margin-bottom: 12px; }
      .sgroup h4 { font-size: 12px; font-weight: 500; color: hsl(var(--muted-foreground)); margin: 4px 2px 6px; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
      .tile { border-radius: 12px; overflow: hidden; background: hsl(var(--app-raised)); cursor: grab; outline: 1px solid transparent; transition: background 0.15s; }
      .tile.ontl { background: hsl(var(--app-raised) / 0.35); }
      .tile:hover { outline-color: hsl(var(--app-line)); }
      .tile .th { position: relative; display: grid; place-items: center; overflow: hidden; color: #fff; }
      .tile .th .ti { width: 26px; height: 26px; opacity: 0.85; }
      .tile .badge { position: absolute; top: 6px; left: 6px; font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: rgb(var(--ok)); color: #04140d; font-weight: 600; }
      .tile .add { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgb(255 255 255 / 0.92); color: #111; display: none; place-items: center; box-shadow: 0 2px 8px rgb(0 0 0 / 0.3); }
      .tile .add [data-lucide] { width: 16px; height: 16px; }
      .tile:hover .add { display: grid; }
      .tile .up { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; color: #fff; font-size: 11.5px; text-align: center; background: rgb(0 0 0 / 0.55); }
      .tile .info { padding: 8px 10px; }
      .tile .nm { font-size: 12.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tile .sb { font-size: 11.5px; line-height: 1.25; margin-top: 2px; color: hsl(var(--muted-foreground)); }
      .pempty { padding: 40px 10px; text-align: center; color: hsl(var(--muted-foreground)); font-size: 12.5px; }
      .props { padding: 6px 4px 12px; display: flex; flex-direction: column; gap: 16px; }
      .ph { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
      .ph b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pmeta { font-size: 11.5px; color: hsl(var(--muted-foreground)); margin-top: -10px; }
      .pg { display: flex; flex-direction: column; gap: 9px; }
      .pg h5 { font-size: 11.5px; color: hsl(var(--muted-foreground)); font-weight: 500; }
      .pr { display: grid; grid-template-columns: 44px 1fr 46px; align-items: center; gap: 8px; font-size: 12px; }
      .pr input[type="range"] { width: 100%; accent-color: rgb(var(--brand)); }
      .pr .pv { text-align: right; font-size: 11.5px; color: hsl(var(--muted-foreground)); }
      .opts { display: flex; flex-wrap: wrap; gap: 6px; }
      .opt { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid hsl(var(--app-line)); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
      .opt:hover:not(:disabled) { background: hsl(var(--app-raised)); }
      .opt.on { background: hsl(var(--app-raised)); border-color: hsl(var(--foreground) / 0.35); font-weight: 600; }
      .opt:disabled { opacity: 0.45; }
      .opt [data-lucide] { width: 13px; height: 13px; }
      .props textarea { width: 100%; min-height: 72px; resize: vertical; border-radius: 12px; border: 1px solid hsl(var(--app-line)); background: hsl(var(--app-raised) / 0.5); color: hsl(var(--foreground)); padding: 8px 10px; font: inherit; font-size: 13px; outline: none; }
      .props textarea:focus { border-color: hsl(var(--foreground) / 0.35); }

      /* ---------- 预览 ---------- */
      .preview { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
      .work:not(.land) > .preview { flex: none; }
      .stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px 12px 4px; container-type: size; }
      .screen { width: min(100cqw, calc(100cqh * var(--arn))); aspect-ratio: var(--ar); border-radius: 12px; overflow: hidden; position: relative; background: #000; box-shadow: 0 30px 60px -30px rgb(0 0 0 / 0.8); display: grid; place-items: center; color: #fff; text-align: center; container-type: inline-size; }
      .screen .big { font-size: 7cqw; font-weight: 700; text-shadow: 0 2px 10px rgb(0 0 0 / 0.5); }
      .screen .small { font-size: 4cqw; opacity: 0.85; margin-top: 4px; }
      .screen .ov { position: absolute; transform: translate(-50%, -50%); aspect-ratio: var(--ar); overflow: hidden; display: grid; place-items: center; font-size: 4cqw; font-weight: 600; box-shadow: 0 6px 20px rgb(0 0 0 / 0.45); }
      .screen .sub { position: absolute; left: 6%; right: 6%; text-align: center; font-weight: 600; line-height: 1.35; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000; }
      .screen .sub.title { font-weight: 800; letter-spacing: 0.04em; }
      .screen .auds { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
      .screen .auds span, .screen .mutemark { background: rgb(0 0 0 / 0.5); border-radius: 999px; padding: 2px 8px; font-size: 10.5px; display: flex; gap: 4px; align-items: center; }
      .screen .mutemark { position: absolute; top: 8px; right: 8px; }
      .pv-ctrl { display: flex; align-items: center; gap: 12px; padding: 4px 14px 10px; }
      .pv-ctrl .tc { font-family: "Geist Mono", monospace; font-size: 12.5px; }
      .empty { display: grid; place-items: center; text-align: center; gap: 8px; }
      .empty .ic { width: 56px; height: 56px; border-radius: 18px; background: hsl(var(--app-raised)); display: grid; place-items: center; margin: 0 auto 6px; color: hsl(var(--muted-foreground)); }
      .empty .ic [data-lucide] { width: 24px; height: 24px; }
      .ibtn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: hsl(var(--foreground)); }
      .ibtn:hover:not(:disabled) { background: hsl(var(--app-raised)); }
      .ibtn:disabled { opacity: 0.3; }
      .ibtn.on { color: rgb(var(--brand)); }
      .ibtn [data-lucide] { width: 16px; height: 16px; }

      /* ---------- 时间线 ---------- */
      .tl { flex: none; display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative; }
      .tl-tools { display: flex; align-items: center; gap: 2px; padding: 6px 10px; border-bottom: 1px solid hsl(var(--app-line)); flex: none; }
      .tl-tools .sep { width: 1px; height: 18px; background: hsl(var(--app-line)); margin: 0 6px; }
      .zoom { width: 110px; accent-color: hsl(var(--foreground)); }
      .tl-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
      .tl-inner { position: relative; min-height: 100%; }
      .rrow { position: sticky; top: 0; z-index: 8; display: flex; height: 28px; background: hsl(var(--app-panel)); border-bottom: 1px solid hsl(var(--app-line) / 0.7); }
      .corner { position: sticky; left: 0; z-index: 9; flex: none; background: hsl(var(--app-panel)); border-right: 1px solid hsl(var(--app-line)); }
      .ruler { position: relative; flex: none; cursor: pointer; }
      .tick { position: absolute; top: 0; height: 100%; border-left: 1px solid hsl(var(--muted-foreground) / 0.35); font-size: 10.5px; color: hsl(var(--muted-foreground)); padding: 6px 0 0 4px; font-family: "Geist Mono", monospace; }
      .tick.minor { height: 6px; top: auto; bottom: 0; padding: 0; }
      .lrow { display: flex; border-bottom: 1px solid hsl(var(--app-line) / 0.45); }
      .thead { position: sticky; left: 0; z-index: 6; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 10px; background: hsl(var(--app-panel)); border-right: 1px solid hsl(var(--app-line)); }
      .thead .tb { font: 600 10.5px "Geist Mono", monospace; padding: 1px 5px; border-radius: 5px; background: hsl(var(--app-raised)); color: hsl(var(--muted-foreground)); margin-right: 4px; }
      .k-main .thead .tb { background: rgb(var(--brand) / 0.18); color: rgb(var(--brand)); }
      .thead .tn { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
      .thead .tn [data-lucide] { width: 12px; height: 12px; color: rgb(var(--brand)); }
      .tbtn { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: hsl(var(--muted-foreground)); flex: none; }
      .tbtn:hover:not(:disabled) { background: hsl(var(--app-raised)); color: hsl(var(--foreground)); }
      .tbtn.on { color: rgb(var(--brand)); }
      .tbtn:disabled { opacity: 0.3; }
      .tbtn [data-lucide] { width: 13px; height: 13px; }
      .lane { position: relative; flex: none; }
      .k-main .lane { background: hsl(var(--app-track) / 0.3); }
      .lrow.lock .lane { background-image: repeating-linear-gradient(135deg, transparent 0 6px, hsl(var(--muted-foreground) / 0.07) 6px 12px); }
      .lrow.hid .lane .clip, .lrow.mut .lane .clip.k-audio { opacity: 0.35; }
      .lane-cta { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); height: 22px; padding: 0 9px; border-radius: 999px; border: 1px dashed hsl(var(--app-line)); font-size: 11.5px; color: hsl(var(--muted-foreground)); display: inline-flex; align-items: center; gap: 4px; }
      .lane-cta:hover { color: hsl(var(--foreground)); border-color: hsl(var(--muted-foreground)); }
      .lane-cta [data-lucide] { width: 12px; height: 12px; }
      .clip { position: absolute; top: 4px; bottom: 4px; border-radius: 8px; overflow: hidden; cursor: grab; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.25); }
      .k-text .clip, .k-audio .clip, .k-overlay .clip { top: 3px; bottom: 3px; border-radius: 7px; }
      .clip .frames { position: absolute; inset: 0; }
      .clip .lab { position: absolute; left: 6px; top: 3px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / 0.8); display: flex; gap: 4px; align-items: center; white-space: nowrap; max-width: calc(100% - 10px); overflow: hidden; z-index: 2; }
      .clip .lab [data-lucide] { width: 11px; height: 11px; }
      .clip .dur { position: absolute; left: 6px; bottom: 3px; font-size: 10.5px; color: #fff; font-family: "Geist Mono", monospace; text-shadow: 0 1px 3px rgb(0 0 0 / 0.8); z-index: 2; }
      .clip .icons { position: absolute; right: 6px; bottom: 3px; display: flex; gap: 3px; color: #fff; z-index: 2; }
      .clip .icons [data-lucide] { width: 12px; height: 12px; }
      .clip.k-text { background: rgb(var(--violet) / 0.5); }
      .clip.k-text .lab { top: 50%; transform: translateY(-50%); }
      .clip.k-audio .wave { position: absolute; inset: 0; }
      .clip .vline { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid rgb(255 255 255 / 0.7); pointer-events: none; z-index: 1; }
      .clip .fade { position: absolute; top: 0; bottom: 0; background: rgb(0 0 0 / 0.45); pointer-events: none; z-index: 1; }
      .clip .fade.fi { left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
      .clip .fade.fo { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); }
      .clip .fh { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgb(0 0 0 / 0.45); cursor: ew-resize; z-index: 4; display: none; }
      .clip.sel .fh, .clip:hover .fh { display: block; }
      .clip.sel { border-color: rgb(var(--brand)); }
      .clip.dragging { opacity: 0.35; }
      .clip.baddrop { border-color: rgb(var(--bad)) !important; }
      .clip.placeholder { background: repeating-linear-gradient(135deg, hsl(var(--app-raised)) 0 8px, hsl(var(--app-track)) 8px 16px); }
      .clip.placeholder .lab, .clip.placeholder .dur { color: hsl(var(--muted-foreground)); text-shadow: none; }
      .clip.invalid { border-color: rgb(var(--bad)); background: hsl(var(--app-raised)); }
      .clip.invalid .frames { filter: grayscale(1) brightness(0.5); }
      .clip.synced:not(.sel) { border-color: rgb(var(--info)); }
      .clip .syncdot { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--info)); box-shadow: 0 0 0 2px rgb(0 0 0 / 0.35); z-index: 2; }
      .clip .h { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; display: none; z-index: 3; }
      .clip .h::after { content: ""; position: absolute; top: 30%; bottom: 30%; left: 2.5px; width: 4px; border-radius: 2px; background: #fff; }
      .clip .h-l { left: 0; background: rgb(var(--brand)); }
      .clip .h-r { right: 0; background: rgb(var(--brand)); }
      .clip.sel .h, .clip:hover .h { display: block; }
      .clip:not(.sel):hover .h { background: rgb(255 255 255 / 0.3); }
      .ro .clip .h, .ro .clip .fh, .lrow.lock .clip .h, .lrow.lock .clip .fh { display: none !important; }
      .durpill { position: absolute; top: 2px; transform: translateX(-50%); background: hsl(var(--foreground)); color: hsl(var(--background)); font-size: 11px; font-family: "Geist Mono", monospace; padding: 1px 7px; border-radius: 999px; white-space: nowrap; z-index: 12; pointer-events: none; }
      .ins { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: rgb(var(--brand)); border-radius: 2px; z-index: 5; box-shadow: 0 0 10px rgb(var(--brand)); }
      .dropbox { position: absolute; top: 3px; bottom: 3px; border-radius: 7px; border: 2px dashed rgb(var(--brand)); background: rgb(var(--brand) / 0.12); pointer-events: none; z-index: 5; }
      .dropbox.no { border-color: rgb(var(--bad)); background: rgb(var(--bad) / 0.12); }
      .snapline { position: absolute; top: 28px; bottom: 0; width: 0; border-left: 1px dashed rgb(var(--info)); z-index: 9; pointer-events: none; }
      .playhead { position: absolute; top: 0; bottom: 0; width: 0; z-index: 10; pointer-events: none; }
      .playhead::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: hsl(var(--foreground)); }
      .playhead .knob { position: absolute; top: 2px; left: -6px; width: 12px; height: 14px; border-radius: 3px 3px 6px 6px; background: hsl(var(--foreground)); pointer-events: auto; cursor: ew-resize; }
      .ghost { position: fixed; z-index: 90; pointer-events: none; width: 54px; height: 54px; border-radius: 10px; opacity: 0.85; box-shadow: 0 10px 30px rgb(0 0 0 / 0.4); }
      .menu { position: absolute; z-index: 40; min-width: 200px; padding: 5px; border-radius: 12px; background: hsl(var(--app-panel)); border: 1px solid hsl(var(--app-line)); box-shadow: 0 16px 40px rgb(0 0 0 / 0.35); font-size: 12.5px; }
      .menu .mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border-radius: 8px; text-align: left; }
      .menu .mi:hover:not(:disabled) { background: hsl(var(--app-raised)); }
      .menu .mi:disabled { opacity: 0.4; }
      .menu .mh { padding: 6px 9px 3px; font-size: 11px; color: hsl(var(--muted-foreground)); }
      .menu .sw { width: 22px; height: 30px; border-radius: 4px; flex: none; }
      .menu hr { border: 0; border-top: 1px solid hsl(var(--app-line)); margin: 4px 0; }

      /* ---------- 模拟面板 ---------- */
      .sim-fab { position: fixed; right: 18px; bottom: 18px; z-index: 70; height: 34px; padding: 0 12px; border-radius: 999px; background: rgb(var(--violet)); color: #fff; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.35); }
      .sim-wrap { position: fixed; right: 18px; bottom: 62px; z-index: 70; width: 300px; padding: 12px; border-radius: 14px; background: hsl(var(--app-panel)); border: 1px solid rgb(var(--violet) / 0.5); box-shadow: 0 16px 40px rgb(0 0 0 / 0.4); display: none; }
      .sim-wrap.open { display: block; }
      .sim-h { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: rgb(var(--violet)); margin-bottom: 6px; }
      .sim-g { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px dashed hsl(var(--border)); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: hsl(var(--muted-foreground)); }
      .chip:hover { color: hsl(var(--foreground)); border-color: hsl(var(--muted-foreground)); }
      .chip[aria-pressed="true"] { border-style: solid; border-color: rgb(var(--violet)); color: rgb(var(--violet)); background: rgb(var(--violet) / 0.08); }
    </style>
  </head>
  <body>
    <!-- 成片粗剪单页原型（多轨）：数据都在内存里，刷新复原；视频和音频用色块示意，不调用任何服务。设计依据见 成片粗剪.md -->
    <div class="app" id="app"></div>
    <button class="sim-fab" id="simFab"><i data-lucide="flask-conical"></i>模拟</button>
    <div class="sim-wrap" id="simWrap"><div id="sim"></div></div>
    <div class="toast" id="toastBox"></div>
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const icons = () => { if (window.lucide) lucide.createIcons(); };
      const pad2 = (n) => String(n).padStart(2, "0");
      const fmt = (t) => `${pad2(Math.floor(t / 60))}:${pad2(Math.floor(t % 60))}`;
      const fmtF = (t) => `${pad2(Math.floor(t / 60))}:${pad2(Math.floor(t % 60))}.${pad2(Math.floor((t % 1) * 30))}`;
      const sec1 = (t) => `${(Math.round(t * 10) / 10).toFixed(1)}s`;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const clone = (o) => JSON.parse(JSON.stringify(o));
      let uidN = 0;
      const uid = () => "c" + ++uidN;
      let toastTimer;
      function toast(msg, kind = "ok") {
        const icon = { ok: "circle-check", bad: "circle-x", warn: "triangle-alert", info: "info" }[kind] || "info";
        $("#toastBox").innerHTML = `<div><i data-lucide="${icon}" style="color: rgb(var(--${kind === "info" ? "info" : kind}))"></i>${esc(msg)}</div>`;
        icons();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ($("#toastBox").innerHTML = ""), 2600);
      }

      /* ================= 对账规则（只管主轨，和后端一致） ================= */
      const MIN = 0.5;
      const segLabel = (seg) => `片段 ${pad2(seg.seq + 1)}`;
      const takeOf = (segs, tid) => { for (const s of segs) for (const t of s.takes) if (t.id === tid) return { seg: s, take: t }; return null; };
      const mainClip = (o) => ({ id: uid(), kind: "segment", pinned: false, in: 0, muted: false, vol: 100, fadeIn: 0, fadeOut: 0, ...o });
      function clampTrim(c, dur) {
        c.out = Math.min(c.out, dur);
        if (c.in > c.out - MIN) { c.in = 0; c.out = dur; }
      }
      function reconcile(clips, removed, segs) {
        const out = [];
        const changes = [];
        const refs = [];
        const byId = Object.fromEntries(segs.map((s) => [s.id, s]));
        const changedSeg = new Set();
        for (const c0 of clips) {
          const c = clone(c0);
          if (c.kind !== "segment") { out.push(c); continue; }
          const seg = byId[c.seg];
          if (!seg) {
            if (!changedSeg.has(c.seg)) { changes.push(`${c.segName || "片段"} 已删除，已从时间线移除`); refs.push(null); }
            changedSeg.add(c.seg);
            continue;
          }
          c.segName = segLabel(seg);
          const chosenOk = seg.chosen && seg.takes.some((t) => t.id === seg.chosen && !t.deleted);
          if (!c.pinned) {
            if (!chosenOk) {
              if (c.take) {
                if (!changedSeg.has(seg.id)) { changes.push(`${segLabel(seg)} 取消了采用，变成待采用占位`); refs.push(c.id); }
                changedSeg.add(seg.id);
                c.take = ""; c.in = 0; c.out = seg.seconds;
              }
            } else if (seg.chosen !== c.take) {
              const t = seg.takes.find((x) => x.id === seg.chosen);
              if (!changedSeg.has(seg.id)) { changes.push(c.take ? `${segLabel(seg)} 换成了采用的版本 ${t.v}` : `${segLabel(seg)} 已采用版本 ${t.v}`); refs.push(c.id); }
              changedSeg.add(seg.id);
              if (!c.take) { c.in = 0; c.out = t.dur; } else clampTrim(c, t.dur);
              c.take = seg.chosen;
            }
          }
          out.push(c);
        }
        const sorted = [...segs].sort((a, b) => a.seq - b.seq);
        for (const seg of sorted) {
          if (out.some((c) => c.kind === "segment" && c.seg === seg.id) || removed.includes(seg.id)) continue;
          let at = 0;
          out.forEach((c, i) => { if (c.kind === "segment" && byId[c.seg] && byId[c.seg].seq < seg.seq) at = i + 1; });
          const chosenOk = seg.chosen && seg.takes.some((t) => t.id === seg.chosen && !t.deleted);
          const t = chosenOk ? seg.takes.find((x) => x.id === seg.chosen) : null;
          const nc = mainClip({ seg: seg.id, segName: segLabel(seg), take: t ? t.id : "", out: t ? t.dur : seg.seconds });
          out.splice(at, 0, nc);
          changes.push(`新增${segLabel(seg)}${t ? "" : "（待采用）"}`);
          refs.push(nc.id);
        }
        return { clips: out, removed: removed.filter((id) => byId[id]), changes, refs };
      }

      /* ================= 模拟数据 ================= */
      const SEED_SEGS = () => [
        { id: "s1", seq: 0, seconds: 15, chosen: "t11", lines: ["林夏：这么晚了，你还来做什么？", "陈默：我来拿回属于我的东西。"], takes: [{ id: "t11", v: 1, dur: 15, hue: 212 }, { id: "t12", v: 2, dur: 12, hue: 188 }] },
        { id: "s2", seq: 1, seconds: 15, chosen: "t21", lines: ["林夏：那只箱子，早就沉进湖里了。", "陈默：那我就把湖抽干。", "林夏：你疯了。"], takes: [{ id: "t21", v: 1, dur: 15, hue: 32 }, { id: "t22", v: 2, dur: 15, hue: 48 }, { id: "t23", v: 3, dur: 10, hue: 12 }] },
        { id: "s3", seq: 2, seconds: 15, chosen: "t31", lines: ["陈默：三年前那晚，你看见了什么？", "林夏：……我什么都没看见。"], takes: [{ id: "t31", v: 1, dur: 15, hue: 262 }, { id: "t32", v: 2, dur: 14, hue: 285 }] },
        { id: "s4", seq: 3, seconds: 15, chosen: "t41", lines: ["林夏：别过来！"], takes: [{ id: "t41", v: 1, dur: 15, hue: 160 }] },
      ];
      const CANVAS_MEDIA = [
        { id: "m1", name: "空镜·湖面", media: "video", dur: 6, hue: 198 },
        { id: "m2", name: "片头字卡", media: "image", hue: 45 },
        { id: "m3", name: "林夏定妆", media: "image", hue: 335 },
        { id: "m4", name: "雨夜街道", media: "video", dur: 8, hue: 236 },
        { id: "m5", name: "沉箱特写", media: "image", hue: 120 },
        { id: "a1", name: "配音·林夏 01", media: "audio", role: "voice", dur: 4, hue: 18 },
        { id: "a2", name: "配音·陈默 01", media: "audio", role: "voice", dur: 5, hue: 28 },
        { id: "a3", name: "BGM·雨夜钢琴", media: "audio", role: "music", dur: 90, hue: 42 },
        { id: "a4", name: "音效·雷声", media: "audio", role: "sfx", dur: 3, hue: 150 },
      ];
      const ROLE_HUE = { voice: 18, music: 42, sfx: 150 };
      const defaultClips = (segs) => [...segs].sort((a, b) => a.seq - b.seq).map((s) => {
        const t = s.takes.find((x) => x.id === s.chosen);
        return mainClip({ seg: s.id, segName: segLabel(s), take: t ? t.id : "", out: t ? t.dur : s.seconds });
      });
      const KIND_NAME = { text: "字幕", overlay: "叠加", audio: "音效" };
      const newTrack = (kind, extra = {}) => ({ id: "tk" + uid(), kind, name: KIND_NAME[kind], role: kind === "audio" ? "sfx" : undefined, muted: false, hidden: false, locked: false, clips: [], ...extra });
      function mkSec(kind, p, start, len) {
        const src = p.type === "take" ? { type: "take", seg: p.seg, take: p.take } : { type: "asset", asset: p.asset };
        const c = { id: uid(), start, len, in: 0, src, vol: 100, fadeIn: 0, fadeOut: 0, muted: false };
        if (kind === "overlay") Object.assign(c, { x: 50, y: 50, scale: 100, opacity: 100 });
        return c;
      }
      function defaultTracks() {
        const ov = newTrack("overlay");
        ov.clips.push(Object.assign(mkSec("overlay", { type: "asset", asset: "m2" }, 0, 3), { fadeOut: 0.5 }));
        ov.clips.push(Object.assign(mkSec("overlay", { type: "asset", asset: "m5" }, 33, 4), { x: 72, y: 22, scale: 42 }));
        const voice = newTrack("audio", { role: "voice", name: "配音" });
        voice.clips.push(mkSec("audio", { type: "asset", asset: "a1" }, 2, 4), mkSec("audio", { type: "asset", asset: "a2" }, 16.5, 5));
        const bgm = newTrack("audio", { role: "music", name: "BGM" });
        bgm.clips.push(Object.assign(mkSec("audio", { type: "asset", asset: "a3" }, 0, 45), { vol: 60, fadeIn: 1, fadeOut: 2.5 }));
        return [newTrack("text"), ov, voice, bgm];
      }

      /* 每个人拖出的分栏尺寸存在浏览器里（失败就用默认值） */
      const LAYOUT = (() => {
        const d = { pvW: 400, tlH: 330, panelW: 300 };
        try { return { ...d, ...JSON.parse(localStorage.getItem("rc-proto-layout") || "{}") }; } catch { return d; }
      })();
      const saveLayout = () => { try { localStorage.setItem("rc-proto-layout", JSON.stringify(LAYOUT)); } catch {} };

      let S;
      function resetProto() {
        stopPlay();
        const segs = SEED_SEGS();
        const landscape = S ? S.flags.landscape : false;
        S = {
          segs, clips: defaultClips(segs), muted: false, removed: [], imports: [], tracks: defaultTracks(),
          sel: null, t: 0, playing: false, pps: 14, fit: true, snap: true,
          undo: [], redo: [], save: "saved", rev: 1,
          final: null, exporting: null,
          mode: "media", panel: "segments", filter: "all", sync: null, menu: null,
          drag: null, propBefore: null,
          flags: { failSave: false, failCompose: false, failImport: false, shared: false, empty: false, landscape },
        };
        genSubs(true);
        renderSim();
        renderApp(); fitZoom(); renderTimeline();
      }

      /* ---- 解析 ---- */
      const findAsset = (id) => CANVAS_MEDIA.find((x) => x.id === id) || S.imports.find((x) => x.id === id);
      function resolve(c) {
        if (c.kind === "segment") {
          const seg = S.segs.find((s) => s.id === c.seg);
          if (!c.take) return { type: "ph", label: c.segName, hue: 0, dur: seg ? seg.seconds : c.out };
          const take = seg && seg.takes.find((t) => t.id === c.take);
          if (!take || take.deleted) return { type: "bad", label: `${c.segName} · 版本已删除`, hue: take ? take.hue : 0, dur: c.out };
          return { type: "video", label: c.segName, v: take.v, hue: take.hue, dur: take.dur };
        }
        const m = findAsset(c.asset);
        if (!m || m.failed) return { type: "bad", label: "素材已失效", hue: 0, dur: c.out };
        return { type: m.media, label: m.name, hue: m.hue, dur: m.media === "image" ? 30 : m.dur };
      }
      /** 附属轨片段引用的素材；失效返回 null */
      function mediaOf(src) {
        if (!src) return null;
        if (src.type === "take") {
          const x = takeOf(S.segs, src.take);
          if (!x || x.take.deleted) return null;
          return { media: "video", name: `${segLabel(x.seg)} · 版本 ${x.take.v}`, dur: x.take.dur, hue: x.take.hue };
        }
        const m = findAsset(src.asset);
        if (!m || m.failed || m.uploading != null) return null;
        return { media: m.media, name: m.name, dur: m.media === "image" ? 60 : m.dur, hue: m.hue, role: m.role };
      }
      const lenOf = (c) => c.out - c.in;
      const mainTotal = () => S.clips.reduce((a, c) => a + lenOf(c), 0);
      const total = () => S.tracks.reduce((m, tr) => tr.clips.reduce((mm, c) => Math.max(mm, c.start + c.len), m), mainTotal());
      const starts = () => { let a = 0; return S.clips.map((c) => { const s = a; a += lenOf(c); return s; }); };
      function clipAt(t) {
        const st = starts();
        for (let i = 0; i < S.clips.length; i++) if (t >= st[i] && t < st[i] + lenOf(S.clips[i])) return { i, off: t - st[i] };
        return null;
      }
      function locate(id) {
        if (!id) return null;
        const i = S.clips.findIndex((c) => c.id === id);
        if (i >= 0) return { main: true, clip: S.clips[i], i };
        for (const tr of S.tracks) { const c = tr.clips.find((x) => x.id === id); if (c) return { main: false, clip: c, track: tr }; }
        return null;
      }
      const trackById = (id) => S.tracks.find((t) => t.id === id);
      const editable = () => !S.flags.shared;
      const canEditLoc = (loc) => editable() && !!loc && !(loc.track && loc.track.locked);
      const lenC = (loc) => (loc.main ? lenOf(loc.clip) : loc.clip.len);
      const overlaps = (tr, start, len, exceptId) => tr.clips.some((c) => c.id !== exceptId && start < c.start + c.len - 1e-6 && c.start < start + len - 1e-6);
      function neighbors(tr, c) {
        let prevEnd = 0, nextStart = Infinity;
        for (const x of tr.clips) {
          if (x.id === c.id) continue;
          if (x.start + x.len <= c.start + 1e-6) prevEnd = Math.max(prevEnd, x.start + x.len);
          else if (x.start >= c.start + c.len - 1e-6) nextStart = Math.min(nextStart, x.start);
        }
        return { prevEnd, nextStart };
      }
      /** 轨道显示顺序：字幕 → 叠加（上层在上）→ 主轨 → 音频 */
      const rows = () => [...S.tracks.filter((t) => t.kind === "text"), ...S.tracks.filter((t) => t.kind === "overlay"), { id: "main", kind: "main" }, ...S.tracks.filter((t) => t.kind === "audio")];
      function badgeOf(tr) {
        if (tr.kind === "main") return "V1";
        const same = S.tracks.filter((k) => k.kind === tr.kind);
        const i = same.indexOf(tr);
        if (tr.kind === "overlay") return "V" + (same.length - i + 1);
        return (tr.kind === "audio" ? "A" : "T") + (i + 1);
      }
      const ROWH = { text: 32, overlay: 46, main: 64, audio: 44 };
      const HEAD = 168, PAD = 12;

      /* ---- 吸附：0、播放头、主轨剪辑点、附属轨片段首尾，8px 内 ---- */
      function snapTargets(exceptId) {
        const a = [0, S.t];
        let acc = 0;
        for (const c of S.clips) { a.push(acc); acc += lenOf(c); }
        a.push(acc);
        for (const tr of S.tracks) for (const c of tr.clips) if (c.id !== exceptId) a.push(c.start, c.start + c.len);
        return a;
      }
      function snapTo(t, exceptId) {
        if (!S.snap) return { t, at: null };
        let best = null, bd = 8 / S.pps;
        for (const x of snapTargets(exceptId)) { const d = Math.abs(x - t); if (d < bd) { bd = d; best = x; } }
        return best == null ? { t, at: null } : { t: best, at: best };
      }
      function snapMove(start, len, exceptId) {
        const a = snapTo(start, exceptId), b = snapTo(start + len, exceptId);
        const da = a.at == null ? Infinity : Math.abs(a.t - start);
        const db = b.at == null ? Infinity : Math.abs(b.t - start - len);
        if (da === Infinity && db === Infinity) return { start, at: null };
        return da <= db ? { start: a.t, at: a.at } : { start: b.t - len, at: b.at };
      }

      /* ---- 历史与保存 ---- */
      const snap = () => clone({ clips: S.clips, muted: S.muted, removed: S.removed, tracks: S.tracks });
      function commit(before) {
        S.undo.push(before);
        if (S.undo.length > 100) S.undo.shift();
        S.redo = [];
        dirty();
      }
      function restore(sn) { S.clips = sn.clips; S.muted = sn.muted; S.removed = sn.removed; S.tracks = sn.tracks; if (!locate(S.sel)) S.sel = null; }
      function undo() { if (!S.undo.length) return; S.redo.push(snap()); restore(S.undo.pop()); dirty(); renderApp(); }
      function redo() { if (!S.redo.length) return; S.undo.push(snap()); restore(S.redo.pop()); dirty(); renderApp(); }
      let saveTimer;
      function dirty() {
        if (S.final) S.final.stale = true;
        S.save = "dirty";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => doSave(), 1000);
      }
      function doSave(then) {
        clearTimeout(saveTimer);
        S.save = "saving";
        saveTimer = setTimeout(() => {
          if (S.flags.failSave) {
            S.save = "error";
            if (then) { S.exporting = null; toast("时间线保存失败，没有导出", "bad"); }
            renderTop(); return;
          }
          S.save = "saved"; S.rev++; renderTop();
          if (then) then();
        }, 600);
      }

      /* ---- 编辑操作 ---- */
      function targetIdx() {
        const i = S.clips.findIndex((c) => c.id === S.sel);
        if (i >= 0) return i;
        const a = clipAt(S.t);
        return a ? a.i : -1;
      }

          ? `<div class="work land"><div class="toprow">${panel}<div class="rz rz-v" data-rz="panelW"></div>${pv}</div><div class="rz rz-h" data-rz="tlH"></div>${tl}</div>`
          : `<div class="work"><div class="leftcol">${panel}<div class="rz rz-h" data-rz="tlH"></div>${tl}</div><div class="rz rz-v" data-rz="pvW"></div>${pv}</div>`;
        app.innerHTML = `
          <div class="app-top">
            <button class="ibtn" aria-label="返回"><i data-lucide="arrow-left"></i></button>
            <span class="title">消失的情人 - 六六六儿</span>
            <div class="pillbar"><span>总览</span><span>剧本<i class="dotm"></i></span><span>资产管理</span><span>片场<i class="dotm"></i></span><span class="on">成片</span></div>
            <div class="pillbar" style="margin:0"><span><i data-lucide="sliders-horizontal" style="width:13px;height:13px;vertical-align:-2px"></i> 真人都市电影</span><span>${land ? "16:9" : "9:16"}</span><span>gemini-3.8-flash</span></div>
            <button class="ibtn" aria-label="切换明暗主题" data-act="theme"><i data-lucide="moon"></i></button>
            <div class="pillbar" style="margin:0"><span style="color:hsl(var(--foreground));font-family:'Geist Mono',monospace;font-weight:600"><i class="dotg"></i>✦ 9,998,383</span></div>
          </div>
          <div class="app-body">
            <div class="rail">
              <div class="rail-h">分集</div>
              <div class="rail-i"><i data-lucide="scroll-text"></i>大纲</div>
              <div class="rail-i"><i data-lucide="users"></i>人物</div>
              <div class="rail-i"><i data-lucide="map-pin"></i>地点</div>
              <div class="rail-sep"></div>
              <div class="rail-h" style="margin-bottom:4px">全集</div>
              <div class="rail-eps">${eps.map(([n, all, done, lock]) => `<div class="ep ${n === 1 ? "on" : ""}">${pad2(n)}${lock ? `<i data-lucide="lock" class="lk"></i>` : ""}<span class="bars">${Array.from({ length: all }, (_, k) => `<i class="${k < done ? "on" : ""}"></i>`).join("")}</span></div>`).join("")}</div>
            </div>
            <div class="main">
              <div class="bar" id="bar"></div>
              ${work}
            </div>
          </div>
          <div id="menuBox"></div>`;
        applyLayout();
        renderTop(); renderPanel(); renderPreview(); renderTimeline(); renderMenu();
        icons();
      }
      function applyLayout() {
        const land = S.flags.landscape;
        const panel = $("#panel"), pv = $("#preview"), tl = $("#tl");
        if (!panel) return;
        panel.style.width = land ? LAYOUT.panelW + "px" : "";
        pv.style.width = land ? "" : LAYOUT.pvW + "px";
        tl.style.height = LAYOUT.tlH + "px";
      }

      function renderTop() {
        const bar = $("#bar"); if (!bar) return;
        const reason = exportCheck();
        const busy = !!S.exporting;
        bar.innerHTML = `
          <h2>第 1 集 · 雨夜重逢</h2>
          ${S.save === "error" && editable() ? `<button class="errlink" data-act="retrySave">时间线保存失败 · 重试</button>` : ""}
          ${syncHTML()}
          <span class="spacer"></span>
          <button class="abtn primary" data-act="export" ${reason || busy ? "disabled" : ""} title="${esc(reason || "按时间线合成并下载 mp4，不扣积分")}">
            <i data-lucide="${busy ? "loader-circle" : "download"}" class="${busy ? "spin" : ""}"></i>${busy ? esc(S.exporting) : "导出"}
          </button>`;
        icons();
      }
      function syncHTML() {
        if (!S.sync || !S.sync.items.length) return "";
        const it = S.sync.items;
        return `<span class="syncwrap"><button class="p-info" data-act="syncPop" aria-expanded="${S.sync.open}"><i data-lucide="refresh-cw"></i>片场更新 ${it.length}<i data-lucide="chevron-down"></i></button>
          ${S.sync.open ? `<div class="syncpop">
            <div class="sp-h">已按片场自动同步</div>
            ${it.map((x) => `<button class="sp-i" ${x.ref && S.clips.some((c) => c.id === x.ref) ? `data-loc="${x.ref}"` : "disabled"}><span class="d"></span><span>${esc(x.text)}</span>${x.ref && S.clips.some((c) => c.id === x.ref) ? `<i data-lucide="locate-fixed"></i>` : ""}</button>`).join("")}
            <div class="sp-f">${editable() ? `<button class="abtn sm" data-act="undoSync"><i data-lucide="undo-2"></i>撤销同步</button>` : ""}<span class="spacer"></span><button class="abtn sm" data-act="ackSync">知道了</button></div>
          </div>` : ""}</span>`;
      }

      /* ---- 素材 / 属性面板 ---- */
      const usedAsset = (id) => S.clips.some((c) => c.asset === id) || S.tracks.some((t) => t.clips.some((c) => c.src && c.src.asset === id));
      const usedTake = (id) => S.clips.some((c) => c.take === id) || S.tracks.some((t) => t.clips.some((c) => c.src && c.src.take === id));
      const thumbBg = (media, hue) => media === "audio" ? `hsl(${hue} 38% 22%)` : `linear-gradient(160deg,hsl(${hue} 50% 40%),hsl(${hue} 55% 14%))`;
      function tileHTML(o) {
        const can = editable() && o.uploading == null && !o.failed;
        return `<div class="tile ${o.onTl ? "ontl" : ""}" data-drag='${esc(JSON.stringify(o.payload))}'>
          <div class="th" style="aspect-ratio:${o.aspect};background:${o.bg}">
            ${o.icon ? `<i data-lucide="${o.icon}" class="ti"></i>` : ""}
            ${o.badge ? `<span class="badge">${o.badge}</span>` : ""}
            ${o.uploading != null ? `<span class="up">上传中<br/>${o.uploading}%</span>` : ""}
            ${o.failed ? `<span class="up">上传失败<br/><button data-retry="${o.payload.asset}" style="text-decoration:underline">重试</button></span>` : ""}
            ${can ? `<button class="add" data-add='${esc(JSON.stringify(o.payload))}' title="${o.media === "audio" ? "放到播放头处" : "加到播放头所在段之后"}"><i data-lucide="plus"></i></button>` : ""}
          </div>
          <div class="info"><div class="nm" title="${esc(o.title)}">${esc(o.title)}</div><div class="sb">${esc(o.sub)}</div></div>
        </div>`;
      }
      function renderPanel() {
        const box = $("#panel"); if (!box) return;
        const head = `<div class="pmode"><div class="seg2"><button class="${S.mode === "media" ? "on" : ""}" data-mode="media">素材</button><button class="${S.mode === "props" ? "on" : ""}" data-mode="props">属性</button></div></div>`;
        if (S.mode === "props") { box.innerHTML = head + `<div class="plist">${renderProps()}</div>`; return icons(); }
        const tabs = [["segments", "片段"], ["canvas", "画布素材"], ["imports", "已导入"]];
        const ar = S.flags.landscape ? "16/9" : "9/16";
        let body = "";
        if (S.panel === "segments") {
          body = [...S.segs].sort((a, b) => a.seq - b.seq).map((s) => {
            const takes = s.takes.filter((t) => !t.deleted);
            if (!takes.length) return "";
            return `<div class="sgroup"><h4>${segLabel(s)} · ${s.seconds}s</h4><div class="tiles">${takes.map((t) => tileHTML({ aspect: ar, bg: thumbBg("video", t.hue), title: `版本 ${t.v}`, sub: `${t.dur}s`, badge: t.id === s.chosen ? "已采用" : "", onTl: usedTake(t.id), payload: { type: "take", seg: s.id, take: t.id } })).join("")}</div></div>`;
          }).join("");
        } else {
          const src = S.panel === "canvas" ? CANVAS_MEDIA : S.imports;
          const list = src.filter((m) => S.filter === "all" || m.media === S.filter);
          const SUB = { image: () => "图片", video: (m) => `视频 · ${m.dur}s`, audio: (m) => `音频 · ${m.dur}s` };
          body = list.length
            ? `<div class="tiles">${list.map((m) => tileHTML({ aspect: "1/1", bg: thumbBg(m.media, m.hue), icon: m.media === "audio" ? "audio-lines" : "", media: m.media, title: m.name, sub: SUB[m.media](m), uploading: m.uploading, failed: m.failed, onTl: usedAsset(m.id), payload: { type: "asset", asset: m.id } })).join("")}</div>`
            : `<div class="pempty">${S.panel === "imports" ? "将文件拖至此处添加" : "画布上还没有这类素材"}</div>`;
        }
        box.innerHTML = head + `
          <div class="seg-tabs">${tabs.map(([k, t]) => `<button class="${S.panel === k ? "on" : ""}" data-panel="${k}">${t}</button>`).join("")}</div>
          ${S.panel !== "segments" ? `<div class="filters">${[["all", "全部"], ["video", "视频"], ["image", "图片"], ["audio", "音频"]].map(([k, t]) => `<button class="${S.filter === k ? "on" : ""}" data-filter="${k}">${t}</button>`).join("")}<span class="spacer"></span>${S.panel === "imports" && editable() ? `<button class="abtn sm" data-act="import"><i data-lucide="plus"></i>导入</button>` : ""}</div>` : ""}
          <div class="plist">${body}</div>`;
        icons();
      }
      const PFMT = { vol: (v) => v + "%", opacity: (v) => v + "%", scale: (v) => v + "%", size: (v) => v + "%", x: (v) => v + "%", y: (v) => v + "%", fadeIn: (v) => (+v).toFixed(1) + "s", fadeOut: (v) => (+v).toFixed(1) + "s" };
      function renderProps() {
        const loc = locate(S.sel);
        if (!loc) return `<div class="pempty">未选中片段</div>`;
        const c = loc.clip;
        const dis = canEditLoc(loc) ? "" : "disabled";
        const len = lenC(loc);
        const rng = (k, label, min, max, step) => `<label class="pr"><span>${label}</span><input type="range" data-prop="${k}" min="${min}" max="${max}" step="${step}" value="${c[k] ?? 0}" ${dis} /><span class="pv mono" data-pv="${k}">${PFMT[k](c[k] ?? 0)}</span></label>`;
        const opt = (k, val, label, on, icon) => `<button class="opt ${on ? "on" : ""}" data-propset="${k}" data-val="${val}" ${dis}>${icon ? `<i data-lucide="${icon}"></i>` : ""}${label}</button>`;
        const fades = `<div class="pg"><h5>淡入淡出</h5>${rng("fadeIn", "淡入", 0, Math.min(3, len), 0.1)}${rng("fadeOut", "淡出", 0, Math.min(3, len), 0.1)}</div>`;
        const sound = `<div class="pg"><h5>声音</h5>${rng("vol", "音量", 0, 200, 1)}<div class="opts">${opt("muted", !c.muted, c.muted ? "已静音" : "静音此段", c.muted, c.muted ? "volume-x" : "volume-2")}</div></div>`;
        if (loc.main) {
          const st = starts()[loc.i];
          const r = resolve(c);
          let html = `<div class="ph"><span class="thead" style="all:unset"><span class="tb mono" style="font-size:10.5px;padding:1px 5px;border-radius:5px;background:rgb(var(--brand)/.18);color:rgb(var(--brand))">V1</span></span><b>${esc(c.kind === "segment" ? c.segName : r.label)}</b></div>
            <div class="pmeta mono">起点 ${fmtF(st)} · 时长 ${sec1(len)}</div>`;
          if (c.kind === "segment") {
            const seg = S.segs.find((s) => s.id === c.seg);
            const takes = seg ? seg.takes.filter((t) => !t.deleted) : [];
            html += `<div class="pg"><h5>版本</h5><div class="opts">
              <button class="opt ${!c.pinned ? "on" : ""}" data-swapid="follow" ${dis}><i data-lucide="link"></i>跟随采用</button>
              ${takes.map((t) => `<button class="opt ${c.pinned && c.take === t.id ? "on" : ""}" data-swapid="${t.id}" ${dis}>版本 ${t.v}${t.id === seg.chosen ? " · 采用" : ""}</button>`).join("")}
            </div></div>`;
          }
          if (r.type === "video") html += sound;
          if (r.type === "video" || r.type === "image") html += fades + `<div class="opts"><button class="opt" data-scm="restore" ${dis}><i data-lucide="maximize-2"></i>${r.type === "image" ? "恢复默认 3 秒" : "恢复原长"}</button></div>`;
          return `<div class="props">${html}</div>`;
        }
        const tr = loc.track;
        const badge = `<span class="mono" style="font-size:10.5px;padding:1px 5px;border-radius:5px;background:hsl(var(--app-raised));color:hsl(var(--muted-foreground))">${badgeOf(tr)}</span>`;
        const meta = `<div class="pmeta mono">起点 ${fmtF(c.start)} · 时长 ${sec1(c.len)}${tr.locked ? " · 轨道已锁定" : ""}</div>`;
        if (tr.kind === "text") {
          return `<div class="props"><div class="ph">${badge}<b>字幕</b></div>${meta}
            <textarea data-prop="text" ${dis}>${esc(c.text)}</textarea>
            <div class="pg"><h5>样式</h5><div class="opts">${opt("style", "subtitle", "字幕", c.style === "subtitle")}${opt("style", "title", "标题", c.style === "title")}</div></div>
            <div class="pg"><h5>位置</h5><div class="opts">${opt("pos", "top", "顶部", c.pos === "top")}${opt("pos", "middle", "中间", c.pos === "middle")}${opt("pos", "bottom", "底部", c.pos === "bottom")}</div></div>
            <div class="pg"><h5>字号</h5>${rng("size", "大小", 60, 180, 5)}</div></div>`;
        }
        const m = mediaOf(c.src);
        if (!m) return `<div class="props"><div class="ph">${badge}<b>素材已失效</b></div>${meta}<div class="opts"><button class="opt" data-scm="del" ${dis}><i data-lucide="trash-2"></i>删除</button></div></div>`;
        let html = `<div class="ph">${badge}<b>${esc(m.name)}</b></div>${meta}`;
        if (tr.kind === "overlay") {
          const P = [["50,50,100", "铺满"], ["72,22,42", "右上小窗"], ["28,78,42", "左下小窗"], ["50,50,62", "居中"]];
          html += `<div class="pg"><h5>画面</h5><div class="opts">${P.map(([v, t]) => `<button class="opt ${`${c.x},${c.y},${c.scale}` === v ? "on" : ""}" data-preset="${v}" ${dis}>${t}</button>`).join("")}</div>
            ${rng("x", "横向", 0, 100, 1)}${rng("y", "纵向", 0, 100, 1)}${rng("scale", "缩放", 10, 100, 1)}${rng("opacity", "不透明", 0, 100, 1)}</div>`;
          if (m.media === "video") html += sound;
        } else html += `<div class="pg"><h5>声音</h5>${rng("vol", "音量", 0, 200, 1)}</div>`;
        html += fades;
        if (m.media !== "image" || tr.kind === "overlay") html += `<div class="opts"><button class="opt" data-scm="restore" ${dis}><i data-lucide="maximize-2"></i>${m.media === "image" ? "恢复默认 3 秒" : "恢复原长"}</button></div>`;
        return `<div class="props">${html}</div>`;
      }
      function setProp(loc, k, raw) {
        const c = loc.clip;
        if (k === "text") { c.text = raw; return; }
        let v = +raw;
        if (k === "fadeIn") v = Math.min(v, Math.max(0, lenC(loc) - (c.fadeOut || 0)));
        if (k === "fadeOut") v = Math.min(v, Math.max(0, lenC(loc) - (c.fadeIn || 0)));
        c[k] = Math.round(v * 10) / 10;
        const pv = $(`[data-pv="${k}"]`); if (pv) pv.textContent = PFMT[k](c[k]);
      }

      /* ---- 预览：主轨 + 叠加轨 + 字幕，音频只列出正在响的 ---- */
      function gain(c, local, len) {
        let g = 1;
        if (c.fadeIn > 0 && local < c.fadeIn) g = local / c.fadeIn;
        if (c.fadeOut > 0 && len - local < c.fadeOut) g = Math.min(g, (len - local) / c.fadeOut);
        return clamp(g, 0, 1);
      }
      function renderPreview() {
        const box = $("#preview"); if (!box) return;
        const land = S.flags.landscape;
        const T = total(), t = S.t;
        let stage;
        if (!S.clips.length && !S.tracks.some((tr) => tr.clips.length)) {
          stage = `<div class="empty"><div><div class="ic"><i data-lucide="film"></i></div><b style="font-size:16px">第 1 集还没有片段</b><p class="muted" style="font-size:12.5px;margin:6px 0 10px">先去片场生成分镜、出视频。</p><button class="abtn"><i data-lucide="clapperboard"></i>去片场</button></div></div>`;
        } else {
          let bg = "#000", main = "", muted = S.muted;
          const a = t < mainTotal() ? clipAt(t) : null;
          if (a) {
            const c = S.clips[a.i], r = resolve(c), local = c.in + a.off;
            muted = muted || c.muted;
            if (r.type === "ph") main = `<div><div class="big" style="font-size:6cqw">${esc(c.segName)} 待采用</div><div class="small">合成时跳过</div></div>`;
            else if (r.type === "bad") main = `<div><div class="big" style="font-size:6cqw;color:rgb(var(--bad))">${esc(r.label)}</div><div class="small">请换版本或删掉这段</div></div>`;
            else {
              bg = `linear-gradient(${160 + local * 6}deg,hsl(${r.hue} 55% 42%),hsl(${r.hue} 60% 12%))`;
              main = `<div style="opacity:${gain(c, a.off, lenOf(c))}"><div class="big">${esc(r.label)}</div><div class="small">${r.type === "image" ? "图片" : `版本 ${r.v ?? ""} · 素材内 ${sec1(local)}`}</div></div>`;
            }
          }
          const R = rows();
          let ovs = "", subs = "";
          // 叠加轨从下往上画，上层盖住下层
          [...R].reverse().forEach((tr) => {
            if (tr.kind !== "overlay" || tr.hidden) return;
            const c = tr.clips.find((x) => t >= x.start && t < x.start + x.len); if (!c) return;
            const m = mediaOf(c.src); if (!m) return;
            ovs += `<div class="ov" style="left:${c.x}%;top:${c.y}%;width:${c.scale}%;opacity:${(c.opacity / 100) * gain(c, t - c.start, c.len)};background:linear-gradient(160deg,hsl(${m.hue} 50% 44%),hsl(${m.hue} 55% 16%))">${esc(m.name)}</div>`;
          });
          R.forEach((tr) => {
            if (tr.kind !== "text" || tr.hidden) return;
            const c = tr.clips.find((x) => t >= x.start && t < x.start + x.len); if (!c) return;
            const pos = c.pos === "top" ? "top:12%" : c.pos === "middle" ? "top:50%;transform:translateY(-50%)" : "bottom:9%";
            const fs = (c.style === "title" ? 7.5 : 4.6) * (c.size / 100);
            subs += `<div class="sub ${c.style === "title" ? "title" : ""}" style="${pos};font-size:${fs}cqw">${esc(c.text)}</div>`;
          });
          const auds = R.filter((tr) => tr.kind === "audio" && !tr.muted).flatMap((tr) => tr.clips.filter((x) => t >= x.start && t < x.start + x.len && mediaOf(x.src)).map((x) => mediaOf(x.src).name));
          stage = `<div class="screen" style="background:${bg}">${main}${ovs}${subs}
            ${auds.length ? `<div class="auds">${auds.map((n) => `<span><i data-lucide="music-2" style="width:10px;height:10px"></i>${esc(n)}</span>`).join("")}</div>` : ""}
            ${muted && a ? `<span class="mutemark"><i data-lucide="volume-x" style="width:11px;height:11px"></i>主轨静音</span>` : ""}</div>`;
        }
        box.innerHTML = `
          <div class="stage" style="--ar:${land ? "16/9" : "9/16"};--arn:${land ? 16 / 9 : 9 / 16}">${stage}</div>
          <div class="pv-ctrl"><span class="spacer"></span>
            <button class="ibtn" data-act="play" aria-label="播放"><i data-lucide="${S.playing ? "pause" : "play"}"></i></button>
            <span class="tc">${fmtF(t)} <span class="muted">/ ${fmtF(T)}</span></span>
            <span class="spacer"></span>
            <button class="ibtn ${S.muted ? "on" : ""}" data-act="trackMute" aria-label="主轨静音" ${editable() ? "" : "disabled"}><i data-lucide="${S.muted ? "volume-x" : "volume-2"}"></i></button>
            <button class="ibtn" aria-label="全屏"><i data-lucide="maximize"></i></button>
          </div>`;
        icons();
      }

      /* ---- 时间线 ---- */
      function renderTimeline() {
        const tl = $("#tl"); if (!tl) return;
        const can = editable();
        const old = $("#tlScroll");
        const sl = old ? old.scrollLeft : 0, stp = old ? old.scrollTop : 0;
        tl.innerHTML = `
          <div class="tl-tools">
            <button class="ibtn" data-act="undo" ${S.undo.length && can ? "" : "disabled"} title="撤销 ⌘Z"><i data-lucide="undo-2"></i></button>
            <button class="ibtn" data-act="redo" ${S.redo.length && can ? "" : "disabled"} title="重做 ⇧⌘Z"><i data-lucide="redo-2"></i></button>
            <span class="sep"></span>
            <button class="ibtn" data-act="split" ${can ? "" : "disabled"} title="拆分 S"><i data-lucide="scissors"></i></button>
            <button class="ibtn" data-act="trimL" ${can ? "" : "disabled"} title="向左裁：删掉播放头左边 Q"><i data-lucide="arrow-left-to-line"></i></button>
            <button class="ibtn" data-act="trimR" ${can ? "" : "disabled"} title="向右裁：删掉播放头右边 W"><i data-lucide="arrow-right-to-line"></i></button>
            <button class="ibtn" data-act="del" ${S.sel && can ? "" : "disabled"} title="删除 Delete"><i data-lucide="trash-2"></i></button>
            <span class="spacer"></span>
            ${can ? `<button class="abtn sm" data-act="addTrackMenu" style="margin-right:6px"><i data-lucide="plus"></i>轨道</button>` : ""}
            <button class="ibtn ${S.snap ? "on" : ""}" data-act="snap" title="吸附 N"><i data-lucide="magnet"></i></button>
            <span class="sep"></span>
            <button class="ibtn" data-act="zoomOut" title="缩小"><i data-lucide="circle-minus"></i></button>
            <input class="zoom" type="range" min="0" max="100" value="${ppsToSlider(S.pps)}" id="zoomR" aria-label="缩放" />
            <button class="ibtn" data-act="zoomIn" title="放大"><i data-lucide="circle-plus"></i></button>

      app.addEventListener("wheel", (e) => { if ((e.metaKey || e.ctrlKey) && e.target.closest("#tlScroll")) { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15); } }, { passive: false });

      app.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        const t = e.target;
        if (t.closest(".menu")) return;
        // 分栏拖动
        const rz = t.closest("[data-rz]");
        if (rz) { rz.classList.add("on"); S.drag = { mode: "rz", key: rz.dataset.rz, el: rz, x0: e.clientX, y0: e.clientY, v0: LAYOUT[rz.dataset.rz] }; e.preventDefault(); return; }
        // 播放头 / 刻度尺
        if (t.closest("#knob") || t.closest("#ruler")) {
          stopPlay();
          S.t = clamp(timeFromX(e.clientX), 0, total());
          S.drag = { mode: "seek" };
          renderPlayhead(); renderPreview();
          return;
        }
        // 素材面板拖拽
        const tile = t.closest("[data-drag]");
        if (tile && !t.closest("[data-add]") && !t.closest("[data-retry]")) {
          if (!editable()) return;
          S.drag = { mode: "lib", payload: JSON.parse(tile.dataset.drag), x0: e.clientX, y0: e.clientY, bg: tile.querySelector(".th").style.background, started: false, insIdx: null, target: null };
          return;
        }
        const clipEl = t.closest("[data-clip]");
        if (clipEl) {
          const id = clipEl.dataset.clip;
          const loc = locate(id);
          const changed = S.sel !== id || S.mode !== "props";
          S.sel = id; S.mode = "props";
          if (changed) renderPanel();
          if (!canEditLoc(loc)) { renderTrack(); renderTimelineToolsOnly(); return; }
          const h = t.closest("[data-h]");
          const fd = t.closest("[data-fade]");
          if (loc.main) {
            if (h) S.drag = { mode: "trim", id, side: h.dataset.h, x0: e.clientX, orig: clone(loc.clip), before: snap() };
            else S.drag = { mode: "move", id, x0: e.clientX, moving: false, insIdx: null, before: snap() };
          } else {
            const o = clone(loc.clip);
            if (fd) S.drag = { mode: "fade", id, side: fd.dataset.fade, x0: e.clientX, o, before: snap() };
            else if (h) S.drag = { mode: "strim", id, side: h.dataset.h, x0: e.clientX, o, nb: neighbors(loc.track, loc.clip), dur: mediaOf(loc.clip.src)?.media === "image" || loc.track.kind === "text" ? null : mediaOf(loc.clip.src)?.dur, before: snap() };
            else S.drag = { mode: "smove", id, x0: e.clientX, y0: e.clientY, o, moving: false, ok: true, before: snap() };
          }
          renderTrack(); renderTimelineToolsOnly();
          return;
        }
        if (t.closest("button")) return;
        if (t.closest(".lane")) {
          S.sel = null; S.t = clamp(timeFromX(e.clientX), 0, total()); stopPlay();
          renderTrack(); renderTimelineToolsOnly(); renderPreview();
          if (S.mode === "props") renderPanel();
        }
      });
      document.addEventListener("pointermove", (e) => {
        const d = S && S.drag; if (!d) return;
        if (d.mode === "rz") {
          const work = $(".work").getBoundingClientRect();
          if (d.key === "pvW") LAYOUT.pvW = clamp(d.v0 - (e.clientX - d.x0), 260, work.width * 0.6);
          if (d.key === "panelW") LAYOUT.panelW = clamp(d.v0 + (e.clientX - d.x0), 220, work.width * 0.5);
          if (d.key === "tlH") LAYOUT.tlH = clamp(d.v0 - (e.clientY - d.y0), 180, work.height * 0.72);
          applyLayout();
          if (S.fit) fitZoom();
          renderTrack();
          return;
        }
        if (d.mode === "seek") { S.t = clamp(timeFromX(e.clientX), 0, total()); renderPlayhead(); renderPreview(); return; }
        if (d.mode === "trim") {
          const c = S.clips.find((x) => x.id === d.id); const r = resolve(c); const o = d.orig;
          const dt = (e.clientX - d.x0) / S.pps;
          if (r.type === "image") c.out = clamp(d.side === "l" ? o.out - dt : o.out + dt, MIN, 30);
          else if (d.side === "l") c.in = clamp(o.in + dt, 0, o.out - MIN);
          else c.out = clamp(o.out + dt, o.in + MIN, r.dur);
          renderTrack();
          return;
        }
        if (d.mode === "move") {
          if (!d.moving && Math.abs(e.clientX - d.x0) < 5) return;
          d.moving = true;
          d.insIdx = insIdxFromX(e.clientX);
          renderTrack();
          return;
        }
        if (d.mode === "strim") {
          const c = locate(d.id).clip, o = d.o;
          const dt = (e.clientX - d.x0) / S.pps;
          if (d.side === "l") {
            const s = snapTo(o.start + dt, c.id);
            let ns = s.t;
            const minStart = Math.max(d.nb.prevEnd, d.dur != null ? o.start - o.in : -Infinity);
            ns = clamp(ns, minStart, o.start + o.len - MIN);
            c.start = ns; c.len = o.start + o.len - ns;
            if (d.dur != null) c.in = o.in + (ns - o.start);
            d.snapAt = Math.abs(ns - s.t) < 1e-6 ? s.at : null;
          } else {
            const s = snapTo(o.start + o.len + dt, c.id);
            const maxEnd = Math.min(d.nb.nextStart, o.start + (d.dur != null ? d.dur - o.in : 60));
            const ne = clamp(s.t, o.start + MIN, maxEnd);
            c.len = ne - o.start;
            d.snapAt = Math.abs(ne - s.t) < 1e-6 ? s.at : null;
          }
          c.fadeIn = Math.min(c.fadeIn || 0, c.len); c.fadeOut = Math.min(c.fadeOut || 0, c.len - (c.fadeIn || 0));
          renderTrack();
          return;
        }
        if (d.mode === "fade") {
          const c = locate(d.id).clip, o = d.o;
          const dt = (e.clientX - d.x0) / S.pps;
          if (d.side === "in") c.fadeIn = Math.round(clamp(o.fadeIn + dt, 0, Math.min(3, c.len - c.fadeOut)) * 10) / 10;
          else c.fadeOut = Math.round(clamp(o.fadeOut - dt, 0, Math.min(3, c.len - c.fadeIn)) * 10) / 10;
          renderTrack();
          return;
        }
        if (d.mode === "smove") {
          if (!d.moving && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 5) return;
          d.moving = true;
          const loc = locate(d.id); const c = loc.clip; let tr = loc.track;
          const lid = laneAt(e.clientX, e.clientY);
          const ntr = lid && trackById(lid);
          // 只能挪到同类的另一条轨
          if (ntr && ntr !== tr && ntr.kind === tr.kind && !ntr.locked) { tr.clips = tr.clips.filter((x) => x !== c); ntr.clips.push(c); tr = ntr; }
          const s = snapMove(Math.max(0, d.o.start + (e.clientX - d.x0) / S.pps), c.len, c.id);
          c.start = Math.max(0, s.start); d.snapAt = s.at;
          d.ok = !overlaps(tr, c.start, c.len, c.id);
          renderTrack();
          return;
        }
        if (d.mode === "lib") {
          if (!d.started && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 5) return;
          if (!d.started) { d.started = true; const g = document.createElement("div"); g.className = "ghost"; g.id = "ghost"; g.style.background = d.bg; document.body.appendChild(g); }
          const g = $("#ghost"); g.style.left = e.clientX - 27 + "px"; g.style.top = e.clientY - 27 + "px";
          const media = payloadMedia(d.payload);
          const lid = laneAt(e.clientX, e.clientY);
          d.insIdx = null; d.target = null; d.snapAt = null;
          if (lid === "main" && accepts("main", media)) d.insIdx = insIdxFromX(e.clientX);
          else if (lid && lid !== "main") {
            const tr = trackById(lid);
            if (tr && !tr.locked && accepts(tr.kind, media)) {
              const len = defaultLen(d.payload);
              const s = snapMove(Math.max(0, timeFromX(e.clientX)), len, null);
              const start = Math.max(0, s.start);
              d.target = { tid: lid, start, len, ok: !overlaps(tr, start, len, null) };
              d.snapAt = s.at;
            }
          }
          renderTrack();
        }
      });
      document.addEventListener("pointerup", () => {
        const d = S && S.drag; if (!d) return;
        S.drag = null;
        if (d.mode === "rz") { d.el.classList.remove("on"); saveLayout(); return renderTrack(); }
        if (d.mode === "seek") return;
        if (d.mode === "trim") {
          const c = S.clips.find((x) => x.id === d.id);
          if (c.in !== d.orig.in || c.out !== d.orig.out) { S.t = Math.min(S.t, total()); commit(d.before); }
          return renderApp();
        }
        if (d.mode === "move") {
          if (d.moving && d.insIdx != null) {
            const from = S.clips.findIndex((x) => x.id === d.id);
            let to = d.insIdx;
            if (to !== from && to !== from + 1) {
              const [c] = S.clips.splice(from, 1);
              if (to > from) to--;
              S.clips.splice(to, 0, c);
              commit(d.before);
              return renderApp();
            }
          }
          return renderTrack();
        }
        if (d.mode === "strim" || d.mode === "fade") {
          const c = locate(d.id).clip;
          if (JSON.stringify(c) !== JSON.stringify(d.o)) commit(d.before);
          return afterEdit();
        }
        if (d.mode === "smove") {
          if (!d.moving) return renderTrack();
          if (!d.ok) { restore(d.before); toast("这里已有片段，换个位置", "warn"); }
          else commit(d.before);
          return afterEdit();
        }
        if (d.mode === "lib") {
          const g = $("#ghost"); if (g) g.remove();
          if (!d.started) return renderTrack();
          if (d.insIdx != null) return insertAt(d.insIdx, d.payload);
          if (d.target) {
            if (!d.target.ok) { toast("这里已有片段，换个位置", "warn"); return renderTrack(); }
            return addSec(trackById(d.target.tid), d.payload, d.target.start, d.target.len);
          }
          renderTrack();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (!S) return;
        if (e.target.closest && e.target.closest("input,textarea")) return;
        const k = e.key.toLowerCase();
        if (k === " ") { e.preventDefault(); return togglePlay(); }
        if (k === "n") { S.snap = !S.snap; return renderTimeline(); }
        if (!editable()) return;
        if ((e.metaKey || e.ctrlKey) && k === "z") { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
        if (e.metaKey || e.ctrlKey) return;
        if (k === "s") return split();
        if (k === "q") return trimSide("left");
        if (k === "w") return trimSide("right");
        if (k === "delete" || k === "backspace") { if (S.sel) { e.preventDefault(); removeSel(); } }
        if (k === "escape") { S.sel = null; S.menu = null; renderTrack(); renderMenu(); renderTimelineToolsOnly(); if (S.mode === "props") renderPanel(); }
      });
      window.addEventListener("resize", () => { if (S.fit) fitZoom(); renderTimeline(); });

      $("#simFab").addEventListener("click", () => $("#simWrap").classList.toggle("open"));
      resetProto();
      icons();
    </script>
  </body>
</html>
